# Los tests unitarios no arrancan MiPatrimonioApplication: su AppContainer pone en marcha
# WorkManager, la base de datos real y la generación de órdenes permanentes en cada test,
# que compiten en segundo plano con el propio test y lo bloquean.
application=android.app.Application

# SDK por defecto de los tests: el SDK 36 exige Java 21 y el entorno usa Java 17.
sdk=34
